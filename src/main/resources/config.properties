# Test edilən tətbiqin ünvanı (lokal Juice Shop)
base.url=http://localhost:3000

# chrome | firefox | edge
browser=chrome
headless=false

# Explicit wait müddəti (saniyə)
timeout.seconds=10

# Uğursuz testin neçə dəfə təkrar işlədiləcəyi (0 = təkrar yoxdur)
retry.count=1

# Bu dəyərlərin hamısı komanda sətrindən dəyişdirilə bilər, məsələn:
#   mvn test -Dbrowser=firefox -Dheadless=true -Dbase.url=http://localhost:3000
